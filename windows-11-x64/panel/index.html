<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ideas Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="studio">
    <header class="topbar">
      <h1>Ideas Studio</h1>
      <button id="open-settings" class="icon-button" type="button" aria-label="Settings" title="Settings"></button>
    </header>

    <p id="notice" class="notice" role="status" hidden></p>

    <section class="panel-card" aria-labelledby="sources-heading">
      <div class="card-head">
        <h2 id="sources-heading">Sources</h2>
        <span id="source-count" class="muted"></span>
      </div>
      <p class="source-home"><span class="muted">Home</span> <span id="source-home-path">Finding the session folder...</span></p>
      <ul id="chat-source" class="chat-source"></ul>
      <div class="source-toolbar">
        <button id="source-home" class="text-button" type="button" title="Go to the session home folder">Home</button>
        <button id="source-up" class="icon-button" type="button" aria-label="Up one folder" title="Up one folder" disabled></button>
        <label class="source-sort"><span>Sort</span>
          <select id="source-sort" aria-label="Sort files by">
            <option value="name">Name</option>
            <option value="size">Size</option>
            <option value="createdAt">Date created</option>
            <option value="modifiedAt">Date modified</option>
          </select>
        </label>
        <button id="source-direction" class="icon-button" type="button" aria-label="Sort ascending; switch to descending" title="Sort ascending; switch to descending"></button>
        <button id="source-refresh" class="icon-button" type="button" aria-label="Refresh sources" title="Refresh sources"></button>
      </div>
      <nav id="source-breadcrumbs" class="source-breadcrumbs" aria-label="Source folder"></nav>
      <p id="source-location" class="source-location" hidden></p>
      <ul id="source-list" class="source-list" aria-label="Files and folders"></ul>
      <button id="source-more" class="text-button" type="button" hidden>Show more files and folders</button>
      <details id="selected-files" class="selected-files" hidden>
        <summary id="selected-files-title"></summary>
        <ul id="selected-file-list"></ul>
      </details>
      <p id="source-hint" class="hint" role="status"></p>
    </section>

    <section aria-labelledby="create-heading">
      <h2 id="create-heading" class="section-title">Create</h2>
      <div id="tiles" class="tiles"></div>
    </section>

    <section aria-labelledby="creations-heading">
      <h2 id="creations-heading" class="section-title">Your creations</h2>
      <ul id="creations" class="creations"></ul>
      <p id="creations-empty" class="empty">Tap a tile above to make something from your sources.</p>
      <button id="more" class="text-button" type="button" hidden>Show more</button>
    </section>
  </main>

  <section id="viewer" class="viewer" hidden aria-labelledby="viewer-title">
    <header class="viewer-bar">
      <button id="viewer-back" class="icon-button" type="button" aria-label="Back" title="Back"></button>
      <h2 id="viewer-title"></h2>
      <button id="viewer-save" class="pill-button" type="button"></button>
    </header>
    <div id="viewer-body" class="viewer-body"></div>
    <details id="viewer-details" class="details">
      <summary>About this</summary>
      <dl id="viewer-facts"></dl>
    </details>
  </section>

  <dialog id="customize" class="sheet" aria-labelledby="customize-title">
    <div class="sheet-body">
      <h2 id="customize-title"></h2>
      <fieldset id="choice-group" class="choice-group">
        <legend id="choice-label"></legend>
        <div id="choice-options" class="chips"></div>
      </fieldset>
      <p id="choice-hint" class="muted small">Numbers are targets; the result depends on the selected sources.</p>
      <label class="field">
        <span>Focus or custom instructions <span class="muted">(optional)</span></span>
        <textarea id="focus" rows="3" maxlength="2000" placeholder="For example: focus on the water cycle and write for a first-time reader"></textarea>
      </label>
      <div class="sheet-actions">
        <button class="text-button" data-close="cancel" type="button">Cancel</button>
        <button id="customize-go" class="pill-button primary" data-close="go" type="button">Create</button>
      </div>
    </div>
  </dialog>

  <dialog id="settings" class="sheet" aria-labelledby="settings-title">
    <div class="sheet-body">
      <h2 id="settings-title">Settings</h2>
      <p id="selection-help" class="muted small" role="status"></p>
      <label class="field">
        <span>AI agent</span>
        <select id="agent-select"></select>
      </label>
      <label class="field">
        <span>AI model</span>
        <select id="model-select"></select>
        <span class="muted small">Use the session or project/app defaults, or choose an available model for Studio.</span>
      </label>
      <label class="check-row">
        <input id="second-pass" type="checkbox" checked>
        <span class="source-body">
          <span>Second pass</span>
          <span class="muted small">Review and revise before delivery. Uses additional AI calls.</span>
        </span>
      </label>
      <p id="agent-line" class="muted small"></p>
      <div class="sheet-actions">
        <button id="settings-refresh" class="text-button" type="button">Refresh list</button>
        <button class="text-button" data-close="cancel" type="button">Cancel</button>
        <button id="settings-apply" class="pill-button primary" type="button" disabled>Use selection</button>
      </div>
    </div>
  </dialog>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden>
    <span id="snackbar-text"></span>
    <button id="snackbar-action" class="text-button" type="button" hidden></button>
  </div>
  <script src="main.js"></script>
</body>
</html>
